<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Check Status · VFS Tracking</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#6c8cff" />
<style>
  :root {
    --bg: #0b1020; --bg-soft: #121933; --bg-elev: #182143; --border: #232c52;
    --text: #e8ecff; --text-dim: #9aa3c7; --accent: #6c8cff; --accent-2: #8ba2ff;
    --success: #34d399; --warning: #fbbf24; --error: #f87171;
    --radius: 14px; --shadow: 0 10px 40px rgba(0,0,0,0.45);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7fb; --bg-soft:#fff; --bg-elev:#fff; --border:#e3e7f0; --text:#161a2c; --text-dim:#5e6788; --shadow:0 6px 24px rgba(20,25,50,.08); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(108,140,255,.18), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(52,211,153,.10), transparent 60%), var(--bg);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg,var(--accent),var(--accent-2)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; box-shadow: var(--shadow); }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .nav { margin-bottom: 18px; display: flex; gap: 14px; font-size: 13px; }
  .nav a { color: var(--accent); text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); }
  form { display: grid; gap: 18px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-dim); margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px 14px; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s; appearance: none; -webkit-appearance: none; }
  input::placeholder { color: var(--text-dim); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,140,255,.22); }
  select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%239aa3c7' d='M6 8L0 0h12z'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; cursor: pointer; }
  button { width: 100%; padding: 13px 18px; background: linear-gradient(135deg,var(--accent),var(--accent-2)); color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .08s, opacity .15s; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(108,140,255,.28); }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: .65; cursor: not-allowed; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  button.loading .spinner { display: inline-block; }
  button.loading .label::after { content: "…"; animation: dots 1.4s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes dots { 0%,20%{content:"";} 40%{content:".";} 60%{content:"..";} 80%,100%{content:"...";} }
  .result { margin-top: 22px; padding: 20px 22px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-soft); display: none; }
  .result.show { display: block; }
  .result.success { border-color: rgba(52,211,153,.45); background: linear-gradient(135deg, rgba(52,211,153,.10), transparent); }
  .result.error { border-color: rgba(248,113,113,.45); background: linear-gradient(135deg, rgba(248,113,113,.10), transparent); }
  .result.warning { border-color: rgba(251,191,36,.45); background: linear-gradient(135deg, rgba(251,191,36,.10), transparent); }
  .result-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .result.success .result-header { color: var(--success); }
  .result.error .result-header { color: var(--error); }
  .result.warning .result-header { color: var(--warning); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 20%, transparent); }
  .result-body { color: var(--text); font-size: 15px; }
  .result-meta { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; color: var(--text-dim); }
  .result-meta b { color: var(--text); font-weight: 500; }
  footer { margin-top: 24px; text-align: center; color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">V</div>
    <div>
      <h1>Check Visa Status</h1>
      <div class="subtitle">One-off check — this does <b>not</b> save to the watchlist</div>
    </div>
  </header>

  <div class="nav">
    <a href="/dashboard">← Dashboard</a>
    <a href="/add-tracking">Add to tracking →</a>
  </div>

  <div class="card">
    <form id="form" autocomplete="off" novalidate>
      <div>
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="" disabled selected>Loading countries…</option>
        </select>
      </div>
      <div>
        <label for="reference_number">Reference Number</label>
        <input type="text" id="reference_number" placeholder="e.g. NOR/AUH/190526/0005/01" required spellcheck="false" />
      </div>
      <div>
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" placeholder="As on the application" required />
      </div>
      <button type="submit" id="check-btn">
        <span class="spinner"></span><span class="label">Check status</span>
      </button>
    </form>
    <div id="result" class="result" role="status" aria-live="polite"></div>
  </div>

  <footer>Requests may take up to a minute. Please don't refresh while a check is running.</footer>
</div>

<script>
(() => {
  "use strict";
  const API_BASE = window.location.origin;
  const $ = (id) => document.getElementById(id);
  const form = $("form"), countrySelect = $("country"), refInput = $("reference_number"),
        lastNameInput = $("last_name"), checkBtn = $("check-btn"), result = $("result");

  const escapeHtml = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  const prettify = (key) => key.replace(/_/g," ").replace(/([a-z])([A-Z])/g,"$1 $2").split(" ").map(w => w.length<=2 ? w.toUpperCase() : w[0].toUpperCase()+w.slice(1)).join(" ");

  async function loadCountries() {
    try {
      const res = await fetch(`${API_BASE}/v1/vfs-tracking/supported-countries`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const countries = ((await res.json()).countries || []).slice().sort();
      countrySelect.innerHTML = `<option value="" disabled selected>Select a country…</option>`;
      for (const key of countries) {
        const o = document.createElement("option"); o.value = key; o.textContent = prettify(key); countrySelect.appendChild(o);
      }
    } catch (err) { countrySelect.innerHTML = `<option value="" disabled selected>Failed to load (${err.message})</option>`; }
  }

  function showResult({ kind, title, body, meta }) {
    let html = `<div class="result-header"><span class="dot"></span>${title}</div><div class="result-body">${body}</div>`;
    if (meta) { html += `<div class="result-meta">`; for (const [k,v] of Object.entries(meta)) html += `<b>${escapeHtml(k)}</b><span>${escapeHtml(String(v))}</span>`; html += `</div>`; }
    result.className = `result show ${kind}`; result.innerHTML = html;
  }
  function setLoading(l) { checkBtn.disabled = l; checkBtn.classList.toggle("loading", l); [countrySelect,refInput,lastNameInput].forEach(i => i.disabled = l); }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const country = countrySelect.value, reference_number = refInput.value.trim(), last_name = lastNameInput.value.trim();
    if (!country || !reference_number || !last_name) { showResult({ kind:"warning", title:"Missing fields", body:"Please fill in all three fields." }); return; }
    result.classList.remove("show"); setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/v1/vfs-tracking/check-status/${encodeURIComponent(country)}`, {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ reference_number, last_name }),
      });
      const text = await res.text(); let data; try { data = JSON.parse(text); } catch { data = { detail: text }; }
      if (res.ok) {
        showResult({ kind:"success", title:"Status retrieved", body: escapeHtml(data.status || "(no status text)"),
          meta: { Country: prettify(data.country||country), "Reference Number": data.reference_number||reference_number, "Last Name": data.last_name||last_name } });
      } else {
        const detail = typeof data.detail === "string" ? data.detail : (data.detail && data.detail.error) || JSON.stringify(data.detail) || text;
        showResult({ kind: res.status===422 ? "warning":"error", title: res.status===422 ? "Could not complete check" : `Error ${res.status}`, body: escapeHtml(detail) });
      }
    } catch (err) { showResult({ kind:"error", title:"Network error", body:`Could not reach the API: ${escapeHtml(err.message)}` }); }
    finally { setLoading(false); }
  });

  loadCountries();
})();
</script>
</body>
</html>
