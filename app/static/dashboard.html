<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watchlist Dashboard · VFS Tracking</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#6c8cff" />
<style>
  :root {
    --bg: #0b1020; --bg-soft: #121933; --bg-elev: #182143; --border: #232c52;
    --text: #e8ecff; --text-dim: #9aa3c7; --accent: #6c8cff; --accent-2: #8ba2ff;
    --success: #34d399; --warning: #fbbf24; --error: #f87171;
    --radius: 14px; --shadow: 0 10px 40px rgba(0,0,0,0.45);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb; --bg-soft: #ffffff; --bg-elev: #ffffff; --border: #e3e7f0;
      --text: #161a2c; --text-dim: #5e6788; --shadow: 0 6px 24px rgba(20,25,50,0.08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(108,140,255,0.18), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(52,211,153,0.10), transparent 60%),
      var(--bg);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 20px 80px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .btn {
    padding: 9px 14px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
    text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: transform .08s, border-color .15s;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat .k { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .stat.run .v { font-size: 15px; font-weight: 600; }

  /* Table */
  .card {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.ref, td.deal { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
  td.detail { color: var(--text-dim); max-width: 360px; }
  td.detail.err { color: var(--error); }
  .nowrap { white-space: nowrap; }
  a.deal-link { color: var(--accent); text-decoration: none; }
  a.deal-link:hover { text-decoration: underline; }

  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
    letter-spacing: .02em; white-space: nowrap;
  }
  .b-PENDING  { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent-2); }
  .b-APPROVED { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .b-REJECTED { background: color-mix(in srgb, var(--error) 18%, transparent); color: var(--error); }
  .b-NOT_FOUND{ background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }
  .b-ERROR    { background: color-mix(in srgb, var(--error) 18%, transparent); color: var(--error); }

  .muted { color: var(--text-dim); }
  .empty, .loading { padding: 40px; text-align: center; color: var(--text-dim); }
  footer { margin-top: 20px; text-align: center; color: var(--text-dim); font-size: 12px; }
  .updated { font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">V</div>
    <div>
      <h1>Watchlist Dashboard</h1>
      <div class="subtitle">All tracked applications and their latest visa status</div>
    </div>
    <div class="header-actions">
      <span class="updated" id="updated"></span>
      <button class="btn" id="run-sweep">▶ Run sweep now</button>
      <button class="btn" id="refresh">↻ Refresh</button>
      <a class="btn" href="/check-status">Check status</a>
      <a class="btn primary" href="/add-tracking">+ Add tracking</a>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Deal</th>
            <th>Reference</th>
            <th>Last name</th>
            <th>Country</th>
            <th>Status</th>
            <th>Detail</th>
            <th>Last checked</th>
            <th>Added</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="8" class="loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer>Auto-refreshes every 30s · Sweep runs 10:00 &amp; 17:00 Dubai time</footer>
</div>

<script>
(() => {
  "use strict";
  const API_BASE = window.location.origin;
  const $ = (id) => document.getElementById(id);

  const escapeHtml = (s) => String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const prettify = (key) => !key ? "—" : key
    .replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").split(" ")
    .map((w) => (w.length <= 2 ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1))).join(" ");

  function relTime(iso, nowMs) {
    if (!iso) return null;
    const t = new Date(iso).getTime();
    let diff = Math.round((t - nowMs) / 1000); // seconds; +future / -past
    const past = diff <= 0; diff = Math.abs(diff);
    const units = [["d", 86400], ["h", 3600], ["m", 60], ["s", 1]];
    let label = "0s";
    for (const [u, sec] of units) { if (diff >= sec) { label = Math.floor(diff / sec) + u; break; } }
    return past ? `${label} ago` : `in ${label}`;
  }
  const fmtAbs = (iso) => iso ? new Date(iso).toLocaleString() : "—";

  function cell(iso, nowMs) {
    if (!iso) return `<span class="muted">never</span>`;
    return `<span class="nowrap" title="${escapeHtml(fmtAbs(iso))}">${escapeHtml(relTime(iso, nowMs))}</span>`;
  }

  function renderStats(d) {
    const c = d.summary.by_status || {};
    const order = ["PENDING", "APPROVED", "REJECTED", "NOT_FOUND", "ERROR"];
    const cards = [];
    cards.push(`<div class="stat"><div class="k">Total tracked</div><div class="v">${d.summary.total}</div></div>`);
    for (const s of order) {
      if (c[s]) cards.push(`<div class="stat"><div class="k">${s.replace("_", " ")}</div><div class="v"><span class="badge b-${s}">${c[s]}</span></div></div>`);
    }
    const lr = d.last_run;
    cards.push(`<div class="stat run"><div class="k">Last run</div>
      <div class="v">${lr ? escapeHtml(relTime(lr.finished_at, d._nowMs)) : "—"}</div>
      <div class="sub">${lr ? `checked ${lr.checked} · resolved ${lr.resolved} · errors ${lr.errors ?? 0}` : "no runs recorded yet"}</div></div>`);
    cards.push(`<div class="stat run"><div class="k">Next run</div>
      <div class="v">${d.next_run ? escapeHtml(relTime(d.next_run, d._nowMs)) : "—"}</div>
      <div class="sub" title="${escapeHtml(fmtAbs(d.next_run))}">${d.next_run ? fmtAbs(d.next_run) : ""}</div></div>`);
    $("stats").innerHTML = cards.join("");
  }

  function renderRows(d) {
    const rows = d.rows || [];
    if (!rows.length) { $("rows").innerHTML = `<tr><td colspan="8" class="empty">No tracked applications yet. Add one from the tracker.</td></tr>`; return; }
    $("rows").innerHTML = rows.map((r) => {
      const st = r.display_status || r.status;
      const dealUrl = `https://crm.travnook.com/crm/deal/details/${encodeURIComponent(r.deal_id)}`;
      const isErr = typeof r.status_text === "string" && r.status_text.startsWith("ERROR:");
      const detail = r.status_text ? escapeHtml(r.status_text) : `<span class="muted">—</span>`;
      return `<tr>
        <td class="deal"><a class="deal-link" href="${escapeHtml(dealUrl)}" target="_blank" rel="noopener">${escapeHtml(r.deal_id)}</a></td>
        <td class="ref">${escapeHtml(r.reference_number)}</td>
        <td>${escapeHtml(r.last_name)}</td>
        <td>${escapeHtml(prettify(r.country))}</td>
        <td><span class="badge b-${st}">${escapeHtml(st)}</span></td>
        <td class="detail ${isErr ? "err" : ""}">${detail}</td>
        <td>${cell(r.last_checked_at, d._nowMs)}</td>
        <td>${cell(r.created_at, d._nowMs)}</td>
      </tr>`;
    }).join("");
  }

  async function load() {
    try {
      const res = await fetch(`${API_BASE}/api/watchlist`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const d = await res.json();
      d._nowMs = d.server_time ? new Date(d.server_time).getTime() : Date.now();
      renderStats(d);
      renderRows(d);
      $("updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      $("rows").innerHTML = `<tr><td colspan="8" class="empty">Failed to load: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  $("refresh").addEventListener("click", load);

  // Trigger the GitHub Actions sweep on demand (POST /api/run-sweep).
  const runBtn = $("run-sweep");
  runBtn.addEventListener("click", async () => {
    if (!confirm("Trigger the GitHub Actions sweep now? It runs in the cloud and takes a couple of minutes.")) return;
    const original = runBtn.textContent;
    runBtn.disabled = true;
    runBtn.textContent = "Dispatching…";
    try {
      const res = await fetch(`${API_BASE}/api/run-sweep`, { method: "POST" });
      let data = {};
      try { data = await res.json(); } catch {}
      if (res.ok) {
        runBtn.textContent = "✓ Sweep started";
        setTimeout(() => { runBtn.textContent = original; runBtn.disabled = false; }, 5000);
      } else {
        alert("Could not start the sweep:\n" + (data.detail || `HTTP ${res.status}`));
        runBtn.textContent = original;
        runBtn.disabled = false;
      }
    } catch (err) {
      alert("Network error: " + err.message);
      runBtn.textContent = original;
      runBtn.disabled = false;
    }
  });

  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
